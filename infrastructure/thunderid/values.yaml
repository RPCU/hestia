            grantTypes:
              - "authorization_code"
              - "client_credentials"
              - "refresh_token"
            responseTypes:
              - "code"
            tokenEndpointAuthMethod: "client_secret_post"
            pkceRequired: false
            publicClient: false
            token:
              accessToken:
                userConfig:
                  validityPeriod: 86400
                  attributes:
                    - "given_name"
                    - "family_name"
                    - "username"
                    - "groups"
              idToken:
                validityPeriod: 86400
                userAttributes:
