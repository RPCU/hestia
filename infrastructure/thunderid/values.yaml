    73-zitadel-connection.yaml: |
      resource_type: "connection"
      id: "019a0000-0000-7000-8000-000000000020"
      name: "zitadel"
      description: "RPCU Zitadel OIDC identity provider"
      type: "oidc"
      clientId: "387085074090190709"
      clientSecret: "{{ .ZITADEL_CLIENT_SECRET }}"
      redirectUri: "https://thunderid.platform.rpcu.lan/gate/callback"
      authorizationEndpoint: "https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/authorize"
      tokenEndpoint: "https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/token"
      userInfoEndpoint: "https://rpcu-gabeck.eu1.zitadel.cloud/oidc/v1/userinfo"
      jwksEndpoint: "https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/keys"
      issuer: "https://rpcu-gabeck.eu1.zitadel.cloud"
      scopes:
        - "openid"
        - "email"
        - "profile"
        - "urn:zitadel:iam:org:project:roles"
      attributeConfiguration:
        userTypeResolution:
          default: "openchoreo-user"
        userTypeAttributeMappings:
          - userType: "openchoreo-user"
            attributes:
              - externalAttribute: "email"
                localAttribute: "username"
              - externalAttribute: "email"
                localAttribute: "email"
              - externalAttribute: "given_name"
                localAttribute: "given_name"
              - externalAttribute: "family_name"
                localAttribute: "family_name"
        accountLinking:
          attributes:
            - "email"
    74-federated-flow.yaml: |
      resource_type: "flow"
      id: "019a0000-0000-7000-8000-000000000021"
      name: "OpenChoreo Zitadel Federated Auth"
      handle: "openchoreo-federated-auth"
      flowType: "AUTHENTICATION"
      nodes:
        - id: "start"
          type: "START"
          onSuccess: "zitadel_auth"
        - id: "zitadel_auth"
          type: "TASK_EXECUTION"
          properties:
            idpId: "019a0000-0000-7000-8000-000000000020"
            allowAuthenticationWithoutLocalUser: true
          executor:
            name: "OIDCAuthExecutor"
            inputs:
              - ref: "code"
                identifier: "code"
                type: "TEXT_INPUT"
                required: true
          onSuccess: "provision_admin"
        - id: "provision_admin"
          type: "TASK_EXECUTION"
          condition:
            key: "{{ctx(groups)}}"
            value: "rpcu-admin"
            onSkip: "provision_dev"
          properties:
            assignGroup: "019a0000-0000-7000-8000-000000000040"
          executor:
            name: "ProvisioningExecutor"
          onSuccess: "authorization"
        - id: "provision_dev"
          type: "TASK_EXECUTION"
          properties:
            assignGroup: "019a0000-0000-7000-8000-000000000041"
          executor:
            name: "ProvisioningExecutor"
          onSuccess: "authorization"
        - id: "authorization"
          type: "TASK_EXECUTION"
          executor:
            name: "AuthorizationExecutor"
          onSuccess: "auth_assert"
        - id: "auth_assert"
          type: "TASK_EXECUTION"
          executor:
            name: "AuthAssertExecutor"
          onSuccess: "end"
        - id: "end"
          type: "END"
