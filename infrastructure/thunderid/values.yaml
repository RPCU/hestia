# ThunderID (Thunder) — official chart oci://ghcr.io/thunder-id/helm-charts/thunderid v1.0.0.
# Migrated from the pre-release asgardeo/thunder 0.36.0 chart (whose gate frontend
# had diverged from the generated config.js, causing a blank sign-in page).
fullnameOverride: thunderid
httproute:
  enabled: true
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
  hostnames:
    - thunderid.platform.rpcu.lan
ingress:
  enabled: false
# SQLite requires a single writer pod.
deployment:
  replicaCount: 1
hpa:
  enabled: false
# Persist the SQLite databases across pod restarts/reschedules (REQUIRED — without
# this PVC all identity data is lost when the pod restarts).
persistence:
  enabled: true
  size: 2Gi
# The setup job generates per-install TLS/JWT/AES key material onto this PVC; it
# MUST persist for the life of the deployment (losing it invalidates all issued
# tokens and previously-encrypted data).
certs:
  persistence:
    size: 16Mi
# The setup job generates the Direct-Auth-Secret onto this PVC.
secrets:
  persistence:
    size: 16Mi
configuration:
  server:
    httpOnly: true
    identifier: production
    publicUrl: "https://thunderid.platform.rpcu.lan"
  # Gate client path only — hostname/port/scheme default to server.publicUrl.
  gateClient:
    path: "/gate"
  # The ThunderID Console sends an RFC 8707 resource indicator on token requests
  # that must match a registered resource server. The chart's shipped "System"
  # resource server hardcodes identifier https://localhost:8090/mcp (it does NOT
  # template publicUrl, despite the chart comment), while the console otherwise
  # derives <publicUrl>/mcp — the mismatch yields invalid_target on /console.
  # Pin the console to the actually-seeded identifier so login resolves.
  consoleClient:
    resourceIdentifier: "https://localhost:8090/mcp"
  # Branding shown in the Gate/Console UI. In 1.0.0 this is the supported knob
  # for the value the gate frontend reads as config.brand.product_name.
  brand:
    productName: "ThunderID"
  # 1.0.0 uses FOUR databases (was 3 in 0.36). SQLite for all; the chart's default
  # sqlite sub-block supplies path/options, so we only pin the type.
  database:
    config:
      type: sqlite
    runtime_transient:
      type: sqlite
    entity:
      type: sqlite
    runtime_persistent:
      type: sqlite
  passkey:
    allowedOrigins:
      - "https://console.platform.rpcu.lan"
  # Temporary: verbose logging to capture the exact federated `groups` claim value
  # the OIDC executor stores in runtime data (needed to pin the flow condition).
  log:
    level: debug
setup:
  enabled: true
  # Strong ThunderID Console admin password (username defaults to "admin") from Vault/ESO.
  admin:
    username: "admin"
    passwordRef:
      name: thunderid-bootstrap
      key: admin-password
  # Extra env exposed to the bootstrap importer's Go-template context.
  env:
    - name: PUBLIC_URL
      value: "https://thunderid.platform.rpcu.lan"
  # Strong Backstage OAuth client secret from Vault/ESO — referenced in the
  # Backstage application resource below as {{ .BACKSTAGE_CLIENT_SECRET }}.
  secretEnv:
    - name: BACKSTAGE_CLIENT_SECRET
      secretName: thunderid-bootstrap
      secretKey: backstage-client-secret
    - name: ZITADEL_CLIENT_SECRET
      secretName: thunderid-bootstrap
      secretKey: zitadel-client-secret
    # Strong Workload Publisher client secret (used by the native workflow-plane
    # generate-workload step to authenticate to the OpenChoreo API). Referenced
    # in the shipped 87-workload-publisher-app resource as {{ .WORKFLOWS_CLIENT_SECRET }}.
    - name: WORKFLOWS_CLIENT_SECRET
      secretName: thunderid-bootstrap
      secretKey: workflows-client-secret
# Custom declarative bootstrap resources (Pattern 1) — mounted ALONGSIDE the
# chart's shipped defaults (default OU, Person user_type, admin user, flows,
# Console app, themes). Applied by the in-process `thunderid bootstrap` importer.
# Each document is a resource definition (resource_type: ...), NOT a shell script.
bootstrap:
  scripts:
    70-openchoreo-usertype.yaml: |
      resource_type: "user_type"
      id: "019a0000-0000-7000-8000-000000000010"
      category: "user"
      name: "openchoreo-user"
      ouHandle: "default"
      allowSelfRegistration: true
      systemAttributes:
        display: "username"
      schema:
        username:
          type: "string"
          displayName: "Username"
          required: true
          unique: true
        sub:
          type: "string"
          displayName: "Subject"
          required: false
        password:
          type: "string"
          displayName: "Password"
          required: false
          credential: true
        given_name:
          type: "string"
          displayName: "First Name"
          required: false
        family_name:
          type: "string"
          displayName: "Last Name"
          required: false
        email:
          type: "string"
          displayName: "Email"
          required: true
          unique: true
        name:
          type: "string"
          displayName: "Full Name"
          required: false
