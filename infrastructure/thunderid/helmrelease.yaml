apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thunderid
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: thunderid
  chart:
    spec:
      chart: thunderid
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: thunder-id
        namespace: flux-system
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: thunderid-values
      valuesKey: values.yaml
