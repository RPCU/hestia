apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openchoreo
  namespace: flux-system
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/openchoreo/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchoreo-control-plane
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: openchoreo-control-plane
  chart:
    spec:
      chart: openchoreo-control-plane
      version: "1.2.2"
      sourceRef:
        kind: HelmRepository
        name: openchoreo
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    kubernetesClusterDomain: platform.local
    openchoreoApi:
      clusterGateway:
        # Short in-cluster Service name (resolves via the search domain). The chart
        # default ...svc.cluster.local doesn't resolve here (cluster domain is
        # platform.local). The internal API (:8444) is in-cluster only and its vault
        # cert has no matching internal SAN, so skip server verification for this
        # hop; client mTLS still authenticates us to the gateway.
        url: "https://cluster-gateway.openchoreo-control-plane.svc:8444"
        tls:
          insecure: true
      config:
        server:
          publicUrl: "https://api.platform.rpcu.lan"
        security:
          authorization:
            resync_interval: 5m
      http:
        hostnames:
          - "api.platform.rpcu.lan"
    clusterGateway:
      url: "https://cluster-gateway.openchoreo-control-plane.svc:8444"
      tls:
        issuerRef:
          kind: ClusterIssuer
          name: vault-issuer
        # vault-issuer (pki-int/cm-platform) only signs *.platform.rpcu.lan, so the
        # gateway server cert carries just the external agent-facing SAN. The
        # in-cluster control-plane clients therefore can't hostname-verify it and
        # use tls.insecure (in-cluster hop only, mTLS client-auth still enforced).
        dnsNames:
          - "cluster-gateway.platform.rpcu.lan"
      tlsRoute:
        enabled: true
        hosts:
          - host: cluster-gateway.platform.rpcu.lan
    controllerManager:
      clusterGateway:
        # Short in-cluster Service name (resolves via the search domain). The
        # internal API (:8444) is in-cluster only and its vault cert has no matching
        # internal SAN, so skip server verification for this hop; client mTLS still
        # authenticates us.
        url: "https://cluster-gateway.openchoreo-control-plane.svc:8444"
        tls:
          insecure: true
    backstage:
      secretName: backstage
      database:
        type: postgresql
      baseUrl: "https://console.platform.rpcu.lan"
      http:
        hostnames:
          - "console.platform.rpcu.lan"
      tls:
        enabled: true
      auth:
        redirectUrls:
          - "https://console.platform.rpcu.lan/api/auth/openchoreo-auth/handler/frame"
      openchoreoApi:
        url: "http://openchoreo-api:8080"
    security:
      oidc:
        # Rule: browser-facing endpoints stay external HTTPS; server-to-server
        # calls go in-cluster over plain HTTP (Thunder serves HTTP on :8090,
        # httpOnly=true — TLS is terminated at the gateway):
        #   - jwksUrl  -> fetched by openchoreo-api
        #   - tokenUrl -> code->token exchange by the Backstage backend
        # issuer + authorizationUrl stay external (canonical id + browser redirect).
        # Backstage keeps rpcu-ca-trust because it still validates/discovers
        # against the external issuer over HTTPS.
        issuer: "https://thunderid.platform.rpcu.lan"
        authorizationUrl: "https://thunderid.platform.rpcu.lan/oauth2/authorize"
        jwksUrl: "http://thunderid-service.thunderid.svc.platform.local:8090/oauth2/jwks"
        tokenUrl: "http://thunderid-service.thunderid.svc.platform.local:8090/oauth2/token"
    gateway:
      tls:
        enabled: true
        hostname: "*.platform.rpcu.lan"
        certificateRefs:
          - name: wildcard-tls
