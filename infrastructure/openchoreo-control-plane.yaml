apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openchoreo
  namespace: flux-system
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/openchoreo/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchoreo-control-plane
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: openchoreo-control-plane
  chart:
    spec:
      chart: openchoreo-control-plane
      version: "1.2.2"
      sourceRef:
        kind: HelmRepository
        name: openchoreo
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    kubernetesClusterDomain: platform.local
    openchoreoApi:
      config:
        server:
          publicUrl: "https://api.platform.rpcu.lan"
        security:
          authorization:
            resync_interval: 5m
      http:
        hostnames:
          - "api.platform.rpcu.lan"
    clusterGateway:
      url: "https://cluster-gateway.openchoreo-control-plane.svc:8444"
      tls:
        issuerRef:
          kind: ClusterIssuer
          name: vault-issuer
        dnsNames:
          - "cluster-gateway.platform.rpcu.lan"
      tlsRoute:
        enabled: true
        hosts:
          - host: cluster-gateway.platform.rpcu.lan
    controllerManager:
      clusterGateway:
        url: "https://cluster-gateway.openchoreo-control-plane.svc:8444"
    backstage:
      secretName: backstage
      database:
        type: postgresql
      baseUrl: "https://console.platform.rpcu.lan"
      http:
        hostnames:
          - "console.platform.rpcu.lan"
      tls:
        enabled: true
      # Backstage's Node runtime must trust ThunderID's TLS (served by the
      # control-plane gateway with the private vault-issuer CA). Instead of
      # disabling verification, mount the rpcu-ca-trust bundle and point
      # NODE_EXTRA_CA_CERTS at it so Node trusts the private CA chain.
      extraVolumes:
        - name: rpcu-ca-trust
          configMap:
            name: rpcu-ca-trust
      extraVolumeMounts:
        - name: rpcu-ca-trust
          mountPath: /etc/ssl/rpcu
          readOnly: true
      extraEnv:
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/ssl/rpcu/ca.crt
      auth:
        redirectUrls:
          - "https://console.platform.rpcu.lan/api/auth/openchoreo-auth/handler/frame"
      openchoreoApi:
        url: "http://openchoreo-api:8080"
      features:
        auth:
          redirectFlow:
            enabled: false
    security:
      oidc:
        # Rule: browser-facing endpoints stay external HTTPS; server-to-server
        # calls go in-cluster over plain HTTP (Thunder serves HTTP on :8080,
        # httpOnly=true — TLS is terminated at the gateway):
        #   - jwksUrl  -> fetched by openchoreo-api
        #   - tokenUrl -> code->token exchange by the Backstage backend
        # issuer + authorizationUrl stay external (canonical id + browser redirect).
        # Backstage keeps rpcu-ca-trust because it still validates/discovers
        # against the external issuer over HTTPS.
        issuer: "https://thunderid.platform.rpcu.lan"
        authorizationUrl: "https://thunderid.platform.rpcu.lan/oauth2/authorize"
        jwksUrl: "http://thunderid.thunderid.svc.cluster.local:8080/oauth2/jwks"
        tokenUrl: "http://thunderid.thunderid.svc.cluster.local:8080/oauth2/token"
    gateway:
      tls:
        enabled: true
        hostname: "*.platform.rpcu.lan"
        certificateRefs:
          - name: wildcard-tls
