apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thunderid
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: openchoreo-requirements
  sourceRef:
    kind: GitRepository
    name: hestia
    namespace: flux-system
  path: ./infrastructure/thunderid
  prune: true
  timeout: 10m
