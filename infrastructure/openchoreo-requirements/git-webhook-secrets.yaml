# HMAC secret openchoreo-api checks GitHub autobuild webhooks against. Name,
# namespace and key are hardcoded in openchoreo-api (services/autobuild).
# The same value goes into the GitHub webhook's "Secret" field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-webhook-secrets
  namespace: openchoreo-control-plane
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: git-webhook-secrets
  data:
    - secretKey: github-secret
      remoteRef:
        key: openchoreo/git-webhook
        property: github-secret
