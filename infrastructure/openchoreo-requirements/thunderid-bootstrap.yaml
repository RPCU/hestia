apiVersion: v1
kind: Namespace
metadata:
  name: thunderid
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thunderid-bootstrap
  namespace: thunderid
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: thunderid-bootstrap
  data:
    - secretKey: backstage-client-secret
      remoteRef:
        key: backstage/bootstrap
        property: client-secret
    - secretKey: admin-password
      remoteRef:
        key: thunderid
        property: admin-password
    - secretKey: zitadel-client-secret
      remoteRef:
        key: thunderid
        property: zitadel-client-secret
    - secretKey: workflows-client-secret
      remoteRef:
        key: thunderid
        property: workflows-client-secret
