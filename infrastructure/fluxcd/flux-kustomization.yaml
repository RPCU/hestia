apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hestia
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: hestia
    namespace: flux-system
  path: ./infrastructure/
  prune: true
