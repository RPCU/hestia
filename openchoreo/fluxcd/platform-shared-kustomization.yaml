apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-platform-shared
  namespace: flux-system
spec:
  interval: 5m
  # Cluster-scoped OpenChoreo resources (ClusterComponentType, ClusterTrait,
  # ClusterDataPlane, ClusterAuthzRole, ...). No targetNamespace: these are not
  # namespaced.
  path: ./openchoreo/platform-shared
  prune: true
  sourceRef:
    kind: GitRepository
    name: hestia
    namespace: flux-system
