apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-workflow-templates
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  # Argo ClusterWorkflowTemplates (checkout-source, docker/react/buildpack
  # coordinators, publish-image, generate-workload) consumed by the workflow
  # plane's Argo Workflows controller. Cluster-scoped, co-located on the platform
  # cluster. Requires the Argo CRDs installed by the openchoreo-workflow-plane
  # HelmRelease — retryInterval covers the ordering if they are not ready yet.
  path: ./openchoreo/workflow-templates
  prune: true
  sourceRef:
    kind: GitRepository
    name: hestia
    namespace: flux-system
