# Workload Publisher client secret for the native build pipeline.
# generate-workload (ClusterWorkflowTemplate) authenticates to the OpenChoreo API
# as `openchoreo-workload-publisher-client` to register the built Workload. Its
# build pods run in the OpenChoreo-created `workflows-<org-namespace>` namespace
# (here `workflows-rpcu`) on the workflow plane (co-located platform cluster), so
# the Vault-backed client secret must be materialised as a k8s Secret THERE for
# generate-workload to mount it (see the template's CLIENT_SECRET env).
#
# This replaces the upstream weak literal default so the strong Vault secret set
# on the ThunderID `87-workload-publisher-app` is actually used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workload-publisher-oidc
  namespace: workflows-rpcu
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: workload-publisher-oidc
  data:
    - secretKey: client-secret
      remoteRef:
        key: thunderid
        property: workflows-client-secret
