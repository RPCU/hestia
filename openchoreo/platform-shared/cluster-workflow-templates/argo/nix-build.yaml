# Nix OCI build step for the OpenChoreo build pipeline.
#
# Drop-in replacement for the `containerfile-build` / buildpack `build-image`
# steps: it consumes the checked-out source at /mnt/vol/source and produces
# /mnt/vol/app-image.tar tagged ${IMAGE_NAME}:${GIT_REVISION}, which the shared
# `publish-image` step then loads, retags to the registry and pushes.
#
# Instead of Podman + a Containerfile, it uses Nix: the app repo ships a Nix
# expression that builds a reproducible OCI image (for chihiro: ./nix/oci.nix,
# which uses dockerTools.streamLayeredImage). Because streamLayeredImage produces
# a *script* that streams the image tarball to stdout, we run that script to a
# temp tar, then use skopeo to re-tag the archive to the name OpenChoreo's
# publish-image step expects. skopeo works on docker-archive files directly, so
# no container daemon / privileged Podman is needed here.
#
# Build speed: a persistent RWX PVC (ceph-cephfs) is mounted at /nix-cache
# and used as a Nix `file://` binary cache — nix-build pulls prebuilt store
# paths from it (substituter) and pushes the result closure back afterwards
# (`nix copy`). This is far faster than seeding /nix/store directly, which
# both shadowed the image's store and never actually persisted newly-built
# paths (the store DB lives on the ephemeral rootfs, not the PVC).
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: nix-build
spec:
  templates:
    - name: build-image
      inputs:
        parameters:
          - name: git-revision
          # Accepted for interface-compatibility with the other builders; Nix
          # builds are hermetic, so build-env is not injected into the build.
          - name: build-env
          # Path (relative to app root) of the Nix expression that evaluates to a
          # streamLayeredImage / buildLayeredImage derivation.
          - name: nix-file
          # Extra `--argstr key value` pairs passed to nix-build, as a JSON array
          # of {name,value} objects (e.g. dockerVersion). Optional.
          - name: nix-args
      container:
        image: nixos/nix:2.24.9
        env:
          - name: IMAGE_NAME
            value: '{{workflow.parameters.image-name}}'
          - name: GIT_REVISION
            value: '{{inputs.parameters.git-revision}}'
          - name: APP_PATH
            value: '{{workflow.parameters.app-path}}'
          - name: NIX_FILE
            value: '{{inputs.parameters.nix-file}}'
          - name: NIX_ARGS_JSON
            value: '{{inputs.parameters.nix-args}}'
        command:
          - sh
          - -c
        args:
          - |-
            set -e

            # Persistent Nix binary cache on the shared RWX PVC (ceph-cephfs).
            # We do NOT mount the PVC at /nix/store — that would (a) shadow the
            # image's own store and (b) not actually persist newly-built paths,
            # since the store DB lives on the ephemeral rootfs at /nix/var. Using
            # the PVC as a `file://` binary cache is the idiomatic, fast approach:
            # nix-build pulls prebuilt paths from it (substituter) and we push the
            # result closure back after the build (`nix copy`). NAR files are large
            # sequential writes — far friendlier to NFS than millions of tiny
            # per-file cp syscalls.
            CACHE_DIR="/nix-cache"
            # Uncompressed NARs: CPU-cheap and the store paths are already on a
            # dedicated PVC, so we trade a little space for faster push/pull.
            CACHE_URI="file://${CACHE_DIR}?compression=none"
            mkdir -p "$CACHE_DIR"

            # Write nix.conf rather than a multi-line NIX_CONFIG env var (keeps the
            # YAML block scalar clean). The PVC cache is added as a trusted
            # substituter so cache hits skip rebuilds; paths we push are unsigned
            # (no signing key on a plain file:// cache) so require-sigs is off for
            # this local, trusted cache. nix-command is enabled only so `nix copy`
            # works — the build itself still uses classic nix-build. Network is
            # still needed for the nixpkgs channel and uncached fixed-output derivs.
            mkdir -p /etc/nix
            {
              echo "experimental-features = nix-command"
              echo "sandbox = false"
              echo "require-sigs = false"
              echo "substituters = https://cache.nixos.org ${CACHE_URI}"
              echo "trusted-substituters = ${CACHE_URI}"
            } >> /etc/nix/nix.conf

            APP_DIR="/mnt/vol/source"
            [ "$APP_PATH" = "." ] || [ -z "$APP_PATH" ] || APP_DIR="/mnt/vol/source/${APP_PATH#/}"

            IMAGE="${IMAGE_NAME}:${GIT_REVISION}"

            echo ">> Image: $IMAGE"
            echo ">> App dir: $APP_DIR"
            echo ">> Nix file: $NIX_FILE"

            if [ ! -d "$APP_DIR" ]; then
              echo ">> Error: app path '$APP_PATH' does not exist in the repository"
              ls -la /mnt/vol/source/
              exit 1
            fi
            if [ ! -f "$APP_DIR/$NIX_FILE" ]; then
              echo ">> Error: Nix file not found at '$NIX_FILE' (relative to app path)"
              echo ">> Repository contents:"
              ls -la "$APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            # A nixpkgs channel is required for `import <nixpkgs>`. Pin to a
            # release channel for reproducibility across runs.
            nix-channel --add https://nixos.org/channels/nixos-26.05 nixpkgs
            nix-channel --update

            # Build the extra --argstr flags from NIX_ARGS_JSON (JSON array of
            # {name,value}). Values are passed as strings. jq comes from the
            # nixpkgs channel; we shell into it once and emit tab-separated pairs.
            set --
            if [ -n "$NIX_ARGS_JSON" ] && [ "$NIX_ARGS_JSON" != "[]" ]; then
              printf '%s' "$NIX_ARGS_JSON" > /tmp/nix-args.json
              args_kv=$(nix-shell -p jq --run \
                'jq -r ".[] | [.name, .value] | @tsv" /tmp/nix-args.json')
              OLDIFS=$IFS
              IFS='
            '
              for line in $args_kv; do
                key=$(printf '%s' "$line" | cut -f1)
                val=$(printf '%s' "$line" | cut -f2)
                [ -n "$key" ] && set -- "$@" --argstr "$key" "$val"
              done
              IFS=$OLDIFS
            fi

            echo ">> Building OCI image with Nix"
            # nix-build reads the PVC substituter from NIX_CONFIG above, so any
            # store path already in the cache is fetched instead of rebuilt.
            # streamLayeredImage: nix-build yields a path to a script that streams
            # the image tar to stdout. buildLayeredImage would yield the tar path
            # directly; handle both.
            OUT=$(nix-build "$NIX_FILE" --no-out-link "$@")
            echo ">> nix-build output: $OUT"

            # Push the full build closure to the PVC binary cache for next time.
            # nix copy is parallel and idempotent — it only transfers paths the
            # cache is missing, so warm runs are a fast no-op. Backgrounded so it
            # never blocks image assembly; we wait for it before the step exits.
            echo ">> Pushing build closure to persistent cache"
            nix copy --to "$CACHE_URI" "$OUT" &
            CACHE_PUSH_PID=$!

            RAW_TAR="/mnt/vol/nix-image.tar"
            if [ -x "$OUT" ] || head -c2 "$OUT" 2>/dev/null | grep -q '#!'; then
              echo ">> Streaming image via output script"
              "$OUT" > "$RAW_TAR"
            else
              echo ">> Using image tar produced directly by nix-build"
              cp "$OUT" "$RAW_TAR"
            fi

            # Re-tag the archive to the ref OpenChoreo's publish-image expects.
            # skopeo operates on docker-archive files with no daemon.
            echo ">> Re-tagging archive to $IMAGE with skopeo"
            nix-shell -p skopeo --run \
              "skopeo copy --insecure-policy docker-archive:${RAW_TAR} docker-archive:/mnt/vol/app-image.tar:${IMAGE}"

            rm -f "$RAW_TAR"

            # Ensure the cache push finished before the pod (and its PVC mount)
            # goes away; a failed push must not fail the build (cache is an
            # optimisation, not a correctness dependency).
            echo ">> Waiting for cache push to finish"
            wait "$CACHE_PUSH_PID" || echo ">> Warning: cache push failed, continuing"

            echo ">> Image built successfully: /mnt/vol/app-image.tar ($IMAGE)"
        volumeMounts:
          - mountPath: /mnt/vol
            name: workspace
          - mountPath: /nix-cache
            name: nix-store-cache
