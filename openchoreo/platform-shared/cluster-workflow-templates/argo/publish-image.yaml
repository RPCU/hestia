apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: publish-image
spec:
  templates:
    - name: publish-image
      podSpecPatch: '{"hostUsers": false}'
      inputs:
        parameters:
          - name: git-revision
          - name: git-tag
            default: ""
      outputs:
        parameters:
          - name: image
            valueFrom:
              path: /tmp/image.txt
      volumes:
        - name: registry-push-secret
          secret:
            optional: true
            secretName: "{{workflow.parameters.registry-push-secret}}"
        - name: storage
          emptyDir:
            sizeLimit: 10Gi
      container:
        image: ghcr.io/openchoreo/podman-runner:v1.2
        env:
          - name: GIT_REVISION
            value: "{{inputs.parameters.git-revision}}"
          - name: GIT_TAG
            value: "{{inputs.parameters.git-tag}}"
          - name: IMAGE_NAME
            value: "{{workflow.parameters.image-name}}"
        command:
          - sh
          - -c
        args:
          - |-
            set -e

            # RPCU: push built images to the self-hosted zot registry under a fixed
            # `public` namespace: zot.rpcu.io/public/<image-name>:<tag>.
            # The tag is the git tag when the commit is tagged (e.g. v1.2.3),
            # otherwise the commit SHA. Auth comes from the registry-push-secret
            # dockerconfigjson (a zot htpasswd user from Vault key
            # `registry-push-secret`). zot creates repos on push; the `public`
            # path allows anonymous pull, so there are no per-package rights and
            # no data-plane pull secret.
            REGISTRY_ENDPOINT="zot.rpcu.io/public"
            if [ -n "$GIT_TAG" ]; then
              IMAGE_TAG="$GIT_TAG"
            else
              IMAGE_TAG="$GIT_REVISION"
            fi
            TARGET_IMAGE="${REGISTRY_ENDPOINT}/${IMAGE_NAME}:${IMAGE_TAG}"
            AUTH_FILE="/etc/secrets/registry-push-secret/.dockerconfigjson"

            echo ">> Target image: $TARGET_IMAGE"
            echo ">> Authentication: $([ -f "$AUTH_FILE" ] && echo "registry secret found" || echo "no registry secret (anonymous push)")"

            if [ ! -f "/mnt/vol/app-image.tar" ]; then
              echo ">> Error: Built image tar not found at /mnt/vol/app-image.tar"
              echo ">> Hint: The build step may have failed to produce an image. Check the build step logs."
              exit 1
            fi

            mkdir -p /storage/run /storage/graph
            cat > /etc/containers/storage.conf <<EOF
            [storage]
            driver = "overlay"
            runroot = "/storage/run"
            graphroot = "/storage/graph"
            [storage.options.overlay]
            EOF

            LOADED_OUTPUT=$(podman load -i /mnt/vol/app-image.tar)
            echo ">> $LOADED_OUTPUT"
            SRC_IMAGE=$(echo "$LOADED_OUTPUT" | grep "Loaded image:" | head -1 | sed 's/Loaded image: //')

            if [ -z "$SRC_IMAGE" ]; then
              echo ">> Error: Could not determine loaded image name from podman load output"
              exit 1
            fi

            echo ">> Source image: $SRC_IMAGE"
            podman tag "$SRC_IMAGE" "$TARGET_IMAGE"

            echo ">> Pushing image to registry"
            if [ -f "$AUTH_FILE" ]; then
              podman push --tls-verify=true --authfile "$AUTH_FILE" "$TARGET_IMAGE"
            else
              podman push --tls-verify=true "$TARGET_IMAGE"
            fi

            echo ">> Image published successfully: $TARGET_IMAGE"
            echo -n "$TARGET_IMAGE" > /tmp/image.txt
        securityContext:
          privileged: true
        volumeMounts:
          - mountPath: /mnt/vol
            name: workspace
          - mountPath: /storage
            name: storage
          - mountPath: /etc/secrets/registry-push-secret
            name: registry-push-secret
            readOnly: true
