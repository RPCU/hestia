apiVersion: openchoreo.dev/v1alpha1
kind: ClusterProjectType
metadata:
  name: standard
  annotations:
    openchoreo.dev/display-name: Standard Project Type
    openchoreo.dev/description: >-
      Minimal project type that provisions only the cell namespace per
      environment. Per-environment labels and annotations can be added
      to the namespace via ProjectReleaseBinding.spec.environmentConfigs
      (namespaceLabels, namespaceAnnotations). Use as the starting
      template when no additional shared infrastructure (NetworkPolicies,
      ResourceQuotas, baseline RBAC) is needed.
  labels:
    openchoreo.dev/name: standard
spec:
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        namespaceLabels:
          type: object
          additionalProperties:
            type: string
          default: {}
        namespaceAnnotations:
          type: object
          additionalProperties:
            type: string
          default: {}
  resources:
    - id: cell-namespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${metadata.namespace}
          # environmentConfigs is the raw ProjectReleaseBinding value; OpenChoreo
          # does NOT inject the openAPIV3Schema defaults into the CEL context, so
          # guard the optional keys with has() to avoid "no such key" render errors.
          labels: "${oc_merge(metadata.labels, has(environmentConfigs.namespaceLabels) ? environmentConfigs.namespaceLabels : {})}"
          annotations: "${has(environmentConfigs.namespaceAnnotations) ? environmentConfigs.namespaceAnnotations : {}}"
    # OpenChoreo generates a per-app NetworkPolicy that only allows ingress from
    # gateways labelled `openchoreo.dev/system-component`. Our external gateway
    # (kgateway-system/https) is Sveltos/argus-managed and carries no such label,
    # so its Envoy proxies get dropped (connection timeout). NetworkPolicies are
    # additive, so this policy widens the allow-list for every pod in the cell
    # namespace to also accept ingress from the kgateway-system namespace —
    # unblocking the gateway without editing the built-in policy or the gateway.
    - id: allow-kgateway-ingress
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-kgateway-system-ingress
          namespace: ${metadata.namespace}
        spec:
          podSelector: {}
          policyTypes:
            - Ingress
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kgateway-system
