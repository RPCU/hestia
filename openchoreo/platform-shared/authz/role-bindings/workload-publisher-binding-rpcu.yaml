# Authorize the native build pipeline to register Workloads via the OpenChoreo API.
#
# The shipped `workload-publisher-binding` authorizes sub=openchoreo-workload-publisher-client,
# but RPCU's self-hosted ThunderID issues the m2m client_credentials token `sub`
# equal to the app RESOURCE ID — here 019a0000-...-067 for the `87-workload-publisher-app`
# bootstrap app — not the clientId slug. So the shipped binding never matches and
# generate-workload gets HTTP 403 when creating the Workload.
#
# This additive binding maps that actual sub onto the shipped `workload-publisher`
# ClusterAuthzRole (workload:create/update/view + workflowrun:*). Pure GitOps, no
# ThunderID reinstall.
#
# Alternative: set the app `id` to "openchoreo-workload-publisher-client" (like the
# Backstage app) so the token sub equals the slug and the shipped binding matches —
# that removes the need for this file but requires a ThunderID reinstall.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: workload-publisher-binding-rpcu
spec:
  effect: allow
  entitlement:
    claim: sub
    value: "019a0000-0000-7000-8000-000000000067"
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: workload-publisher
