apiVersion: openchoreo.dev/v1alpha1
kind: ClusterWorkflow
metadata:
  name: nix-builder
  labels:
    openchoreo.dev/workflow-type: "component"
  annotations:
    openchoreo.dev/description: "Build a reproducible OCI image from a repo's Nix expression (dockerTools.streamLayeredImage / buildLayeredImage)"
spec:
  workflowPlaneRef:
    kind: ClusterWorkflowPlane
    name: default
  ttlAfterCompletion: "1d"
  parameters:
    openAPIV3Schema:
      type: object
      required:
        - repository
      properties:
        repository:
          type: object
          description: "Git repository configuration"
          required:
            - url
          properties:
            url:
              type: string
              description: "Git repository URL"
              x-openchoreo-component-parameter-repository-url: true
            secretRef:
              type: string
              default: ""
              description: "Secret reference name for Git credentials"
              x-openchoreo-component-parameter-repository-secret-ref: true
            revision:
              type: object
              default: {}
              properties:
                branch:
                  type: string
                  default: main
                  description: "Git branch to checkout"
                  x-openchoreo-component-parameter-repository-branch: true
                commit:
                  type: string
                  default: ""
                  description: "Git commit SHA or reference (optional, defaults to latest)"
                  x-openchoreo-component-parameter-repository-commit: true
            appPath:
              type: string
              default: "."
              description: "Path to the application directory within the repository"
              x-openchoreo-component-parameter-repository-app-path: true
        nix:
          type: object
          default: {}
          description: "Nix build configuration"
          properties:
            file:
              type: string
              default: "./nix/oci.nix"
              description: "Path to the Nix expression (relative to appPath) that evaluates to a streamLayeredImage/buildLayeredImage derivation"
            args:
              type: array
              default: []
              description: "Extra --argstr key/value pairs passed to nix-build (e.g. dockerVersion). Values are passed as strings."
              items:
                type: object
                required: [name, value]
                properties:
                  name:
                    type: string
                    description: "nix-build --argstr name"
                  value:
                    type: string
                    description: "nix-build --argstr value"
        buildEnv:
          type: array
          default: []
          description: "Accepted for compatibility with other builders; Nix builds are hermetic and do not consume these."
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
        imageName:
          type: string
          default: ""
          description: "Image name segment pushed as <registry>/<imageName>. Defaults to the component name when empty."
        versionArgName:
          type: string
          default: ""
          description: "When set, injects --argstr <name> <version> into the Nix build (git tag or short SHA). Optional."
        revisionArgName:
          type: string
          default: ""
          description: "When set, injects --argstr <name> <git-revision> into the Nix build. Optional."
  runTemplate:
    apiVersion: argoproj.io/v1alpha1
    kind: Workflow
    metadata:
      name: ${metadata.workflowRunName}
      namespace: ${metadata.namespace}
    spec:
      arguments:
        parameters:
          - name: component-name
            value: ${metadata.labels['openchoreo.dev/component']}
          - name: project-name
            value: ${metadata.labels['openchoreo.dev/project']}
          - name: workflowrun-name
            value: ${metadata.workflowRunName}
          - name: namespace-name
            value: ${metadata.namespaceName}
          - name: git-repo
            value: ${parameters.repository.url}
          - name: branch
            value: ${parameters.repository.revision.branch}
          - name: commit
            value: ${parameters.repository.revision.commit}
          - name: app-path
            value: ${parameters.repository.appPath}
          - name: nix-file
            value: ${parameters.nix.file}
          - name: nix-args
            value: ${parameters.nix.args}
          - name: build-env
            value: ${parameters.buildEnv}
          - name: image-name
            value: "${has(parameters.imageName) && parameters.imageName != '' ? parameters.imageName : metadata.labels['openchoreo.dev/component']}"
          - name: git-secret
            value: ${metadata.workflowRunName}-git-secret
          - name: registry-push-secret
            value: ${metadata.workflowRunName}-registry-push-secret
          - name: workload-publisher-secret
            value: ${metadata.workflowRunName}-workload-publisher-secret
          - name: version-arg-name
            value: ${parameters.versionArgName}
          - name: revision-arg-name
            value: ${parameters.revisionArgName}
      serviceAccountName: workflow-sa
      entrypoint: build-workflow
      templates:
        - name: build-workflow
          steps:
            - - name: checkout-source
                templateRef:
                  name: checkout-source
                  clusterScope: true
                  template: checkout
            - - name: build-image
                templateRef:
                  name: nix-build
                  clusterScope: true
                  template: build-image
                arguments:
                  parameters:
                    - name: git-revision
                      value: '{{steps.checkout-source.outputs.parameters.git-revision}}'
                    - name: git-tag
                      value: '{{steps.checkout-source.outputs.parameters.git-tag}}'
                    - name: build-env
                      value: '{{workflow.parameters.build-env}}'
                    - name: nix-file
                      value: '{{workflow.parameters.nix-file}}'
                    - name: nix-args
                      value: '{{workflow.parameters.nix-args}}'
                    - name: version-arg-name
                      value: '{{workflow.parameters.version-arg-name}}'
                    - name: revision-arg-name
                      value: '{{workflow.parameters.revision-arg-name}}'
            - - name: publish-image
                templateRef:
                  name: publish-image
                  clusterScope: true
                  template: publish-image
                arguments:
                  parameters:
                    - name: git-revision
                      value: '{{steps.checkout-source.outputs.parameters.git-revision}}'
                    - name: git-tag
                      value: '{{steps.checkout-source.outputs.parameters.git-tag}}'
            - - name: generate-workload-cr
                templateRef:
                  name: generate-workload
                  clusterScope: true
                  template: generate-workload-cr
                arguments:
                  parameters:
                    - name: image
                      value: '{{steps.publish-image.outputs.parameters.image}}'
                    - name: run-name
                      value: '{{workflow.parameters.workflowrun-name}}'
      volumeClaimTemplates:
        - metadata:
            name: workspace
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 4Gi
      volumes:
        - name: nix-store-cache
          persistentVolumeClaim:
            claimName: nix-store-cache
  externalRefs:
    - id: git-secret-reference
      apiVersion: openchoreo.dev/v1alpha1
      kind: SecretReference
      name: ${parameters.repository.secretRef}
  resources:
    - id: git-secret
      includeWhen: ${has(parameters.repository.secretRef) && parameters.repository.secretRef != ""}
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.workflowRunName}-git-secret
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            kind: ClusterSecretStore
            name: ${workflowplane.secretStore}
          target:
            name: ${metadata.workflowRunName}-git-secret
            creationPolicy: Owner
            template:
              type: ${externalRefs['git-secret-reference'].spec.template.type}
          data: |
            ${externalRefs['git-secret-reference'].spec.data.map(secret, {
              "secretKey": secret.secretKey,
              "remoteRef": {
                "key": secret.remoteRef.key,
                "property": has(secret.remoteRef.property) && secret.remoteRef.property != "" ? secret.remoteRef.property : oc_omit()
              }
            })}
    - id: registry-push-secret
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.workflowRunName}-registry-push-secret
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: ${workflowplane.secretStore}
            kind: ClusterSecretStore
          target:
            name: ${metadata.workflowRunName}-registry-push-secret
            creationPolicy: Owner
            template:
              type: kubernetes.io/dockerconfigjson
              data:
                .dockerconfigjson: "{{ .registrysecret | toString }}"
          data:
            - secretKey: registrysecret
              remoteRef:
                key: registry-push-secret
                property: value
    - id: workload-publisher-secret
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${metadata.workflowRunName}-workload-publisher-secret
          namespace: ${metadata.namespace}
        spec:
          refreshInterval: 15s
          secretStoreRef:
            name: ${workflowplane.secretStore}
            kind: ClusterSecretStore
          target:
            name: ${metadata.workflowRunName}-workload-publisher-secret
            creationPolicy: Owner
          data:
            - secretKey: client-secret
              remoteRef:
                key: thunderid
                property: workflows-client-secret
