apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-platform-rpcu
  namespace: flux-system
spec:
  interval: 5m
  path: ./openchoreo/namespaces/rpcu/platform
  prune: true
  targetNamespace: rpcu
  sourceRef:
    kind: GitRepository
    name: hestia
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-projects-rpcu
  namespace: flux-system
spec:
  interval: 5m
  path: ./openchoreo/namespaces/rpcu/projects
  prune: true
  targetNamespace: rpcu
  sourceRef:
    kind: GitRepository
    name: hestia
    namespace: flux-system
