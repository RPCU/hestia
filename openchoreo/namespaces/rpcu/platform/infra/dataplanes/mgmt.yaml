# mgmt cluster: internal (*.mgmt.rpcu.lan wildcard on kgateway-system/https). Backs the production environment.
#
# The agent on the cluster is deployed by argus (mgmt: clusters/mgmt/
# openchoreo-data-plane.yaml; workload clusters: Sveltos profile
# openchoreo-data-plane, planeID = cluster name). Its client cert is signed by
# the shared agent CA, whose public cert argus publishes to
# rpcu/openchoreo-agent-ca (Sveltos profile openchoreo-control-plane).
apiVersion: openchoreo.dev/v1alpha1
kind: DataPlane
metadata:
  name: mgmt
spec:
  planeID: mgmt
  clusterAgent:
    clientCA:
      secretKeyRef:
        namespace: rpcu
        name: openchoreo-agent-ca
        key: ca.crt
  gateway:
    ingress:
      external:
        name: https
        namespace: kgateway-system
        https:
          host: mgmt.rpcu.lan
          port: 443
  # Dedicated store (argus clusters/mgmt/crossplane/vault/openchoreo-secrets.yaml):
  # mgmt's shared vault-backend uses a hand-made read-only Vault role, so portal
  # secret pushes to this DataPlane got 403. openchoreo-vault can write
  # secret/<ns>/generic/* and read chihiro's pushed `chihiro` key.
  secretStoreRef:
    name: openchoreo-vault
  observabilityPlaneRef:
    kind: ClusterObservabilityPlane
    name: default
