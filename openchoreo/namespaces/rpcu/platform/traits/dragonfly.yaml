apiVersion: openchoreo.dev/v1alpha1
kind: Trait
metadata:
  name: dragonfly
  namespace: rpcu
spec:
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
          description: 'Enable the Redis sidecar. Disable for environments where the app uses cookie sessions.'
        image:
          type: string
          default: 'redis:7-alpine'
          description: 'Redis container image.'
        port:
          type: integer
          default: 6379
          description: 'Redis listening port.'
        resources:
          type: object
          properties:
            requests:
              type: object
              properties:
                cpu:
                  type: string
                  default: '15m'
                memory:
                  type: string
                  default: '256Mi'
            limits:
              type: object
              properties:
                cpu:
                  type: string
                  default: '500m'
                memory:
                  type: string
                  default: '512Mi'
          default:
            requests:
              cpu: '15m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'

  creates:
    - targetPlane: dataplane
      includeWhen: ${environmentConfigs.enabled}
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${metadata.name}-${trait.instanceName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          type: ClusterIP
          selector: ${metadata.podSelectors}
          ports:
            - name: redis
              port: ${environmentConfigs.port}
              targetPort: ${environmentConfigs.port}

  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
      targetPlane: dataplane
      includeWhen: ${environmentConfigs.enabled}
      operations:
        - op: add
          path: /spec/template/spec/containers/-
          value:
            name: ${trait.instanceName}
            image: ${environmentConfigs.image}
            ports:
              - containerPort: ${environmentConfigs.port}
                name: redis
            resources:
              requests:
                cpu: ${environmentConfigs.resources.requests.cpu}
                memory: ${environmentConfigs.resources.requests.memory}
              limits:
                cpu: ${environmentConfigs.resources.limits.cpu}
                memory: ${environmentConfigs.resources.limits.memory}
