# Trait for a DragonflyDB (Redis-compatible) instance next to a component.
# Namespace-scoped: available to Components in the rpcu namespace.
#
# Creates a Dragonfly CR (dragonflydb.io/v1alpha1) in the component's
# environment namespace; the Dragonfly operator (argus: dragonfly-operator on
# mgmt, Sveltos `dragonfly` profile on workload clusters) turns it into a
# StatefulSet + a Service of the SAME name, port 6379. Unlike the former Redis
# sidecar, the instance is shared by every replica, so sessions survive
# load-balancing across pods.
#
# The Service name is predictable — <componentName>-<instanceName> — so point
# the app at it with a plain env var, e.g. for chihiro with instanceName
# session-store: CHIHIRO_REDIS_ADDR=chihiro-session-store:6379.
#
# Requires the Dragonfly operator on the DataPlane's cluster.
#
# Also renders a NetworkPolicy for the Dragonfly pods: the project's
# allow-kgateway-system-ingress policy selects every pod in the environment
# namespace, which default-denies all other ingress. Without this the operator
# cannot reach the admin port to elect a master (so the Service never gets an
# endpoint) and the app cannot reach 6379.
apiVersion: openchoreo.dev/v1alpha1
kind: Trait
metadata:
  name: dragonfly
  namespace: rpcu
spec:
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        replicas:
          type: integer
          default: 1
          description: 'Dragonfly replicas (1 primary + N-1 replicas).'
        resources:
          type: object
          properties:
            requests:
              type: object
              properties:
                cpu:
                  type: string
                  default: '15m'
                memory:
                  type: string
                  default: '64Mi'
            limits:
              type: object
              properties:
                cpu:
                  type: string
                  default: '600m'
                memory:
                  type: string
                  default: '750Mi'
          # Dragonfly sizes its proactor threads from the CPU limit and needs
          # 256MiB per thread under the memory limit, so keep both limits.
          default:
            requests:
              cpu: '15m'
              memory: '64Mi'
            limits:
              cpu: '600m'
              memory: '750Mi'

  creates:
    - targetPlane: dataplane
      template:
        apiVersion: dragonflydb.io/v1alpha1
        kind: Dragonfly
        metadata:
          name: ${metadata.componentName}-${trait.instanceName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          replicas: ${environmentConfigs.replicas}
          resources:
            requests:
              cpu: ${environmentConfigs.resources.requests.cpu}
              memory: ${environmentConfigs.resources.requests.memory}
            limits:
              cpu: ${environmentConfigs.resources.limits.cpu}
              memory: ${environmentConfigs.resources.limits.memory}

    - targetPlane: dataplane
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: ${metadata.componentName}-${trait.instanceName}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          podSelector:
            matchLabels:
              app: ${metadata.componentName}-${trait.instanceName}
          policyTypes:
            - Ingress
          ingress:
            # Clients (the component) and replica-to-replica replication.
            - from:
                - podSelector: {}
              ports:
                - protocol: TCP
                  port: 6379
            # Dragonfly operator: health/role management on the admin port.
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: dragonfly-operator-system
              ports:
                - protocol: TCP
                  port: 6379
                - protocol: TCP
                  port: 9999
