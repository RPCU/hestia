apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  annotations:
    openchoreo.dev/description: Testing - Project for Golang apps
    openchoreo.dev/display-name: Testing
  labels:
    openchoreo.dev/name: testing
  name: testing
spec:
  deploymentPipelineRef:
    name: standard
  type:
    kind: ClusterProjectType
    name: standard
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: testing-development
  name: testing-development
spec:
  owner:
    projectName: testing
  environment: development
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: testing-staging
  name: testing-staging
spec:
  owner:
    projectName: testing
  environment: staging
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: testing-production
  name: testing-production
spec:
  owner:
    projectName: testing
  environment: production
---
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: chihiro-development
  name: chihiro-development
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: chihiro
  environment: development
  workloadOverrides:
    container:
      env:
        - key: CHIHIRO_DEVMODE
          value: "true"
