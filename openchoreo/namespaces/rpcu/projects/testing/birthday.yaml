apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: birthday
  namespace: rpcu
  annotations:
    openchoreo.dev/display-name: 'Birthday'
  labels:
    openchoreo.dev/project: testing
spec:
  owner:
    projectName: testing
  componentType:
    kind: ComponentType
    name: deployment/web-application
  # Same pipeline as chihiro: push to main -> GitHub webhook ->
  # https://openchoreo.rpcu.io/api/v1alpha1/autobuild -> WorkflowRun. The image
  # is built by GitHub Actions (birthday's image.yaml, pushed to
  # zot.rpcu.io/public/birthday:<git tag or short SHA>); the run waits for it
  # and publishes the workload from the repo's workload.yaml descriptor
  # (endpoint-1, HTTP 8080). Without it occ emits no endpoint and the
  # web-application ComponentType refuses to render.
  autoBuild: true
  workflow:
    kind: ClusterWorkflow
    name: prebuilt-image
    parameters:
      repository:
        url: https://github.com/RPCU/birthday
        # appPath left unset on purpose, see chihiro.yaml.
        revision:
          branch: main
  traits:
    # The page is served at <name>.<domain>, <name> being the recipient
    # (lowercase, DNS-safe: "Chloé" -> chloe) and <domain> the environment's
    # gateway domain: test.rpcu.lan (staging), mgmt.rpcu.lan (production),
    # rpcu.io (public). Set it in each ReleaseBinding, next to BIRTHDAY_NAME.
    # development keeps OpenChoreo's generated hostname: it shares the
    # test.rpcu.lan gateway with staging, so the same name would collide.
    - kind: Trait
      name: http-route
      instanceName: hostname
    # Keeps the chat friend's Claude Code login (`claude auth login`) across
    # restarts and redeploys. Per environment (traitEnvironmentConfigs.claude):
    # ReadWriteOnce, so only where replicas is 1 (not public).
    - kind: Trait
      name: persistent-volume
      instanceName: claude
      parameters:
        mountPath: /home/birthday/.claude
---
# Everything the page says comes from the BIRTHDAY_* env vars below (see the
# birthday README), repeated per binding so each environment can differ.
# BIRTHDAY_SECRET (a hidden extra revealed with the I.O.U., e.g. a gift card)
# is the exception in production and public: it is read from a
# per-environment OpenChoreo secret, created and edited in the portal
# (Secrets > generic, written to Vault by openchoreo-api), never from git:
#   birthday-production -> DataPlane mgmt
#   birthday-public     -> DataPlane production
# each with the keys "secret" and "pin" (BIRTHDAY_SECRET_PIN, needed to reveal it). Those SecretReferences are API-managed
# (openchoreo.dev/managed-by: openchoreo-api), so they must not be added here.
# Create them before promoting: a binding whose secret doesn't exist cannot
# deploy (OpenChoreo env refs have no "optional"). development and staging
# use a demo value.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: birthday-development
  name: birthday-development
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: birthday
  environment: development
  componentTypeEnvironmentConfigs:
    # Stdlib Go page using ~10-20Mi, plus the chat friend: each reply runs a
    # ~250Mi Claude Code, two at most at once, and it starts too slowly for the
    # gateway on 1 CPU. Requests stay small so the
    # single-node test cluster keeps room for the rollout's surge pod.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: '2'
        memory: 640Mi
  traitEnvironmentConfigs:
    hostname:
      enabled: false
      gatewayName: https
      sectionName: https
    claude:
      enabled: true
  workloadOverrides:
    container:
      env:
        - key: BIRTHDAY_NAME # keep in sync with the hostname
          value: 'Victor'
        - key: BIRTHDAY_DATE
          value: '10-31'
        - key: BIRTHDAY_MESSAGE
          value: 'I owe you a birthday drink'
        # Announces the hidden extra on the opened card.
        - key: BIRTHDAY_SECRET_INTRO
          value: 'And an Uber gift card, so the ride is on me too'
        # Demo value outside production; the real one is a secret.
        - key: BIRTHDAY_SECRET
          value: 'DEMO-GIFT-CODE-1234'
        - key: BIRTHDAY_SECRET_PIN
          value: '1234'
        # Optional signature under the line:
        # - key: BIRTHDAY_FROM
        #   value: 'Your name'
        - key: BIRTHDAY_TIMEZONE
          value: 'Europe/Paris'
        # Shown in the I.O.U.'s place until it unlocks.
        - key: BIRTHDAY_TEASER
          value: 'A little something is waiting for you'
        # Days the I.O.U. stays visible after the birthday (hidden before it).
        - key: BIRTHDAY_OPEN_DAYS
          value: '15'
        - key: BIRTHDAY_HALLOWEEN
          value: 'true'
        # The chat friend on the opened card, locked by the PIN above. Sign
        # Claude Code in once per pod: kubectl exec -it <pod> -- claude auth login
        # (lost when the pod restarts).
        - key: BIRTHDAY_CHAT
          value: 'true'
        - key: BIRTHDAY_CHAT_NAME
          value: 'Sunny'
        # More on how the friend acts, on top of the cheerful persona:
        # - key: BIRTHDAY_CHAT_PROMPT
        #   value: 'Calls them "birthday star". Loves terrible cake puns.'
        - key: BIRTHDAY_PORT
          value: '8080'
---
# releaseName is set by promotion (development -> staging), not in git.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: birthday-staging
  name: birthday-staging
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: birthday
  environment: staging
  componentTypeEnvironmentConfigs:
