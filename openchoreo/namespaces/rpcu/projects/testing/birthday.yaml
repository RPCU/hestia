apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: birthday
  namespace: rpcu
  annotations:
    openchoreo.dev/display-name: 'Birthday'
  labels:
    openchoreo.dev/project: testing
spec:
  owner:
    projectName: testing
  componentType:
    kind: ComponentType
    name: deployment/web-application
  # Same pipeline as chihiro: push to main -> GitHub webhook ->
  # https://openchoreo.rpcu.io/api/v1alpha1/autobuild -> WorkflowRun. The image
  # is built by GitHub Actions (birthday's image.yaml, pushed to
  # zot.rpcu.io/public/birthday:<git tag or short SHA>); the run waits for it
  # and publishes the workload from the repo's workload.yaml descriptor
  # (endpoint-1, HTTP 8080). Without it occ emits no endpoint and the
  # web-application ComponentType refuses to render.
  autoBuild: true
  workflow:
    kind: ClusterWorkflow
    name: prebuilt-image
    parameters:
      repository:
        url: https://github.com/RPCU/birthday
        # appPath left unset on purpose, see chihiro.yaml.
        revision:
          branch: main
  traits:
    # The page is served at <name>.<domain>, <name> being the recipient
    # (lowercase, DNS-safe: "Chloé" -> chloe) and <domain> the environment's
    # gateway domain: test.rpcu.lan (staging), mgmt.rpcu.lan (production),
    # rpcu.io (public). Set it in each ReleaseBinding, next to BIRTHDAY_NAME.
    # development keeps OpenChoreo's generated hostname: it shares the
    # test.rpcu.lan gateway with staging, so the same name would collide.
    - kind: Trait
      name: http-route
      instanceName: hostname
---
# Everything the page says comes from the BIRTHDAY_* env vars below (see the
# birthday README), repeated per binding so each environment can differ.
# BIRTHDAY_SECRET (a hidden extra revealed with the I.O.U., e.g. a gift card)
# is the exception in production and public: it is read from a
# per-environment OpenChoreo secret, created and edited in the portal
# (Secrets > generic, written to Vault by openchoreo-api), never from git:
#   birthday-production -> DataPlane mgmt
#   birthday-public     -> DataPlane production
# each with the key "secret". Those SecretReferences are API-managed
# (openchoreo.dev/managed-by: openchoreo-api), so they must not be added here.
# Create them before promoting: a binding whose secret doesn't exist cannot
# deploy (OpenChoreo env refs have no "optional"). development and staging
# use a demo value.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: birthday-development
  name: birthday-development
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: birthday
  environment: development
  componentTypeEnvironmentConfigs:
    # Stdlib Go page using ~10-20Mi: the web-application defaults (100m/256Mi)
    # left no room on the single-node test cluster for the rollout's surge pod.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  traitEnvironmentConfigs:
    hostname:
      enabled: false
      gatewayName: https
      sectionName: https
  workloadOverrides:
    container:
      env:
        - key: BIRTHDAY_NAME # keep in sync with the hostname
          value: 'Victor'
        - key: BIRTHDAY_DATE
          value: '10-31'
        - key: BIRTHDAY_MESSAGE
          value: 'I owe you a birthday drink'
        # Announces the hidden extra on the opened card.
        - key: BIRTHDAY_SECRET_INTRO
          value: 'And an Uber gift card, so the ride is on me too'
        # Demo value outside production; the real one is a secret.
        - key: BIRTHDAY_SECRET
          value: 'DEMO-GIFT-CODE-1234'
        # Optional signature under the line:
        # - key: BIRTHDAY_FROM
        #   value: 'Your name'
        - key: BIRTHDAY_TIMEZONE
          value: 'Europe/Paris'
        # Shown in the I.O.U.'s place until it unlocks.
        - key: BIRTHDAY_TEASER
          value: 'A little something is waiting for you'
        # Days the I.O.U. stays visible after the birthday (hidden before it).
        - key: BIRTHDAY_OPEN_DAYS
          value: '15'
        - key: BIRTHDAY_HALLOWEEN
          value: 'true'
        - key: BIRTHDAY_PORT
          value: '8080'
---
# releaseName is set by promotion (development -> staging), not in git.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: birthday-staging
  name: birthday-staging
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: birthday
  environment: staging
  componentTypeEnvironmentConfigs:
    # Stdlib Go page using ~10-20Mi: the web-application defaults (100m/256Mi)
    # left no room on the single-node test cluster for the rollout's surge pod.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  traitEnvironmentConfigs:
    hostname:
      enabled: true
      hostnames: ['victor.test.rpcu.lan'] # <name>.test.rpcu.lan
      gatewayName: https
      sectionName: https
  workloadOverrides:
    container:
      env:
        - key: BIRTHDAY_NAME # keep in sync with the hostname
          value: 'Victor'
        - key: BIRTHDAY_DATE
          value: '10-31'
        - key: BIRTHDAY_MESSAGE
          value: 'I owe you a birthday drink'
        # Announces the hidden extra on the opened card.
        - key: BIRTHDAY_SECRET_INTRO
          value: 'And an Uber gift card, so the ride is on me too'
        # Demo value outside production; the real one is a secret.
        - key: BIRTHDAY_SECRET
          value: 'DEMO-GIFT-CODE-1234'
        # Optional signature under the line:
        # - key: BIRTHDAY_FROM
        #   value: 'Your name'
        - key: BIRTHDAY_TIMEZONE
          value: 'Europe/Paris'
        # Shown in the I.O.U.'s place until it unlocks.
        - key: BIRTHDAY_TEASER
          value: 'A little something is waiting for you'
        # Days the I.O.U. stays visible after the birthday (hidden before it).
        - key: BIRTHDAY_OPEN_DAYS
          value: '15'
        - key: BIRTHDAY_HALLOWEEN
          value: 'true'
        - key: BIRTHDAY_PORT
          value: '8080'
---
# Production: internal, on mgmt at <name>.mgmt.rpcu.lan.
# releaseName is set by promotion (staging -> production), not in git.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: birthday-production
  name: birthday-production
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: birthday
  environment: production
  componentTypeEnvironmentConfigs:
    # Stdlib Go page using ~10-20Mi: the web-application defaults (100m/256Mi)
    # left no room on the single-node test cluster for the rollout's surge pod.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  traitEnvironmentConfigs:
    hostname:
      enabled: true
      hostnames: ['victor.mgmt.rpcu.lan'] # <name>.mgmt.rpcu.lan
      gatewayName: https
      sectionName: https
  workloadOverrides:
    container:
      env:
        - key: BIRTHDAY_NAME # keep in sync with the hostname
          value: 'Victor'
        # Today, to preview the opened card (it stays open 15 days).
        - key: BIRTHDAY_DATE
          value: '10-21'
        - key: BIRTHDAY_MESSAGE
          value: 'I owe you a birthday drink'
        # Announces the hidden extra on the opened card.
        - key: BIRTHDAY_SECRET_INTRO
          value: 'And an Uber gift card, so the ride is on me too'
        # The hidden extra (the Uber gift card), never in git: OpenChoreo secret
        # birthday-production (portal > Secrets), key "secret".
        - key: BIRTHDAY_SECRET
          valueFrom:
            secretKeyRef:
              name: birthday-production
              key: secret
        # Optional signature under the line:
        # - key: BIRTHDAY_FROM
        #   value: 'Your name'
        - key: BIRTHDAY_TIMEZONE
          value: 'Europe/Paris'
        # Shown in the I.O.U.'s place until it unlocks.
        - key: BIRTHDAY_TEASER
          value: 'A little something is waiting for you'
        # Days the I.O.U. stays visible after the birthday (hidden before it).
        - key: BIRTHDAY_OPEN_DAYS
          value: '15'
        - key: BIRTHDAY_HALLOWEEN
          value: 'true'
        - key: BIRTHDAY_PORT
          value: '8080'
---
# Public: on the production cluster, exposed on the internet at
# <name>.rpcu.io (https-external gateway). No secrets: the app has no auth
# and nothing to protect beyond what it displays.
# releaseName is set by promotion (staging -> public), not in git.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  labels:
    openchoreo.dev/name: birthday-public
  name: birthday-public
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: birthday
  environment: public
  componentTypeEnvironmentConfigs:
    replicas: 2
    # Stdlib Go page using ~10-20Mi: the web-application defaults (100m/256Mi)
    # left no room on the single-node test cluster for the rollout's surge pod.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  traitEnvironmentConfigs:
    hostname:
      enabled: true
      hostnames: ['victor.rpcu.io'] # <name>.rpcu.io
      gatewayName: https-external
      sectionName: https
  workloadOverrides:
    container:
      env:
        - key: BIRTHDAY_NAME # keep in sync with the hostname
          value: 'Victor'
        - key: BIRTHDAY_DATE
          value: '10-31'
        - key: BIRTHDAY_MESSAGE
          value: 'I owe you a birthday drink'
        # Announces the hidden extra on the opened card.
        - key: BIRTHDAY_SECRET_INTRO
          value: 'And an Uber gift card, so the ride is on me too'
        # The hidden extra (the Uber gift card), never in git: OpenChoreo secret
        # birthday-public (portal > Secrets), key "secret".
        - key: BIRTHDAY_SECRET
          valueFrom:
            secretKeyRef:
              name: birthday-public
              key: secret
        # Optional signature under the line:
        # - key: BIRTHDAY_FROM
        #   value: 'Your name'
        - key: BIRTHDAY_TIMEZONE
          value: 'Europe/Paris'
        # Shown in the I.O.U.'s place until it unlocks.
        - key: BIRTHDAY_TEASER
          value: 'A little something is waiting for you'
        # Days the I.O.U. stays visible after the birthday (hidden before it).
        - key: BIRTHDAY_OPEN_DAYS
          value: '15'
        - key: BIRTHDAY_HALLOWEEN
          value: 'true'
        - key: BIRTHDAY_PORT
          value: '8080'
