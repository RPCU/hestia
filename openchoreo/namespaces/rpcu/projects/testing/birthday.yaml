    # ~250Mi Claude Code, two at most at once, and it starts too slowly for the
    # gateway on 1 CPU. Requests stay small so the
    # single-node test cluster keeps room for the rollout's surge pod.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: '2'
        memory: 640Mi
  traitEnvironmentConfigs:
    hostname:
      enabled: true
      hostnames: ['victor.test.rpcu.lan'] # <name>.test.rpcu.lan
      gatewayName: https
      sectionName: https
    claude:
      enabled: true
  workloadOverrides:
    container:
      env:
        - key: BIRTHDAY_NAME # keep in sync with the hostname
          value: 'Victor'
        - key: BIRTHDAY_DATE
          value: '10-31'
        - key: BIRTHDAY_MESSAGE
          value: 'I owe you a birthday drink'
        # Announces the hidden extra on the opened card.
        - key: BIRTHDAY_SECRET_INTRO
          value: 'And an Uber gift card, so the ride is on me too'
        # Demo value outside production; the real one is a secret.
        - key: BIRTHDAY_SECRET
          value: 'DEMO-GIFT-CODE-1234'
        - key: BIRTHDAY_SECRET_PIN
          value: '1234'
        # Optional signature under the line:
        # - key: BIRTHDAY_FROM
        #   value: 'Your name'
        - key: BIRTHDAY_TIMEZONE
          value: 'Europe/Paris'
        # Shown in the I.O.U.'s place until it unlocks.
        - key: BIRTHDAY_TEASER
          value: 'A little something is waiting for you'
        # Days the I.O.U. stays visible after the birthday (hidden before it).
        - key: BIRTHDAY_OPEN_DAYS
          value: '15'
        - key: BIRTHDAY_HALLOWEEN
          value: 'true'
        # The chat friend on the opened card, locked by the PIN above. Sign
        # Claude Code in once per pod: kubectl exec -it <pod> -- claude auth login
        # (lost when the pod restarts).
        - key: BIRTHDAY_CHAT
          value: 'true'
        - key: BIRTHDAY_CHAT_NAME
          value: 'Sunny'
        # More on how the friend acts, on top of the cheerful persona:
        # - key: BIRTHDAY_CHAT_PROMPT
        #   value: 'Calls them "birthday star". Loves terrible cake puns.'
        - key: BIRTHDAY_PORT
          value: '8080'
---
# Production: internal, on mgmt at <name>.mgmt.rpcu.lan.
# releaseName is set by promotion (staging -> production), not in git.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  annotations:
    # The web UI owns this binding: Flux creates it if missing but never
    # updates it, so env vars and promotions set in the portal stick (the env
    # list is atomic, so Flux would otherwise replace it every sync). Git
    # edits below no longer reach the live object; apply them by hand or in
    # the portal.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    openchoreo.dev/name: birthday-production
  name: birthday-production
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: birthday
  environment: production
  componentTypeEnvironmentConfigs:
    # Stdlib Go page using ~10-20Mi: the web-application defaults (100m/256Mi)
    # left no room on the single-node test cluster for the rollout's surge pod.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  traitEnvironmentConfigs:
    hostname:
      enabled: true
      hostnames: ['victor.mgmt.rpcu.lan'] # <name>.mgmt.rpcu.lan
      gatewayName: https
      sectionName: https
    # Portal-owned binding: set this in the portal too (git doesn't reach it).
    claude:
      enabled: true
  workloadOverrides:
    container:
      env:
        # BIRTHDAY_NAME, BIRTHDAY_DATE, BIRTHDAY_TEASER, BIRTHDAY_MESSAGE and
        # BIRTHDAY_SECRET_INTRO are deliberately unset here: the app falls back
        # to its defaults ("friend", January 1, "A little something is waiting
        # for you", "I owe you a birthday drink", "And a little extra, just
        # for you").
        # The hidden extra (the Uber gift card), never in git: OpenChoreo secret
        # birthday-production (portal > Secrets), key "secret".
        - key: BIRTHDAY_SECRET
          valueFrom:
            secretKeyRef:
              name: birthday-production
              key: secret
        # PIN to reveal it, from the same portal secret (key "pin").
        - key: BIRTHDAY_SECRET_PIN
          valueFrom:
            secretKeyRef:
              name: birthday-production
              key: pin
        # Optional signature under the line:
        # - key: BIRTHDAY_FROM
        #   value: 'Your name'
        - key: BIRTHDAY_TIMEZONE
          value: 'Europe/Paris'
        # Days the I.O.U. stays visible after the birthday (hidden before it).
        - key: BIRTHDAY_OPEN_DAYS
          value: '15'
        - key: BIRTHDAY_HALLOWEEN
          value: 'true'
        # The chat friend (off by default): BIRTHDAY_CHAT 'true', with
        # BIRTHDAY_CHAT_NAME / BIRTHDAY_CHAT_PROMPT, CLAUDE_CODE_OAUTH_TOKEN
        # (claude setup-token) from this environment's portal secret so every
        # replica is signed in across restarts (or, with one replica, the
        # claude volume: traitEnvironmentConfigs.claude.enabled), and limits
        # raised to cpu 2 / memory 640Mi (see staging).
        - key: BIRTHDAY_PORT
          value: '8080'
---
# Public: on the production cluster, exposed on the internet at
# <name>.rpcu.io (https-external gateway). No secrets: the app has no auth
# and nothing to protect beyond what it displays.
# releaseName is set by promotion (staging -> public), not in git.
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  annotations:
    # The web UI owns this binding: Flux creates it if missing but never
    # updates it, so env vars and promotions set in the portal stick (the env
    # list is atomic, so Flux would otherwise replace it every sync). Git
    # edits below no longer reach the live object; apply them by hand or in
    # the portal.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
  labels:
    openchoreo.dev/name: birthday-public
  name: birthday-public
  namespace: rpcu
spec:
  owner:
    projectName: testing
    componentName: birthday
  environment: public
  componentTypeEnvironmentConfigs:
    replicas: 2
    # Stdlib Go page using ~10-20Mi: the web-application defaults (100m/256Mi)
    # left no room on the single-node test cluster for the rollout's surge pod.
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  traitEnvironmentConfigs:
    hostname:
      enabled: true
      hostnames: ['victor.rpcu.io'] # <name>.rpcu.io
      gatewayName: https-external
      sectionName: https
  workloadOverrides:
    container:
      env:
        # BIRTHDAY_NAME, BIRTHDAY_DATE, BIRTHDAY_TEASER, BIRTHDAY_MESSAGE and
        # BIRTHDAY_SECRET_INTRO are deliberately unset here: the app falls back
        # to its defaults ("friend", January 1, "A little something is waiting
        # for you", "I owe you a birthday drink", "And a little extra, just
        # for you").
        # The hidden extra (the Uber gift card), never in git: OpenChoreo secret
        # birthday-public (portal > Secrets), key "secret".
        - key: BIRTHDAY_SECRET
          valueFrom:
            secretKeyRef:
              name: birthday-public
              key: secret
        # PIN to reveal it, from the same portal secret (key "pin").
        - key: BIRTHDAY_SECRET_PIN
          valueFrom:
            secretKeyRef:
              name: birthday-public
              key: pin
        # Optional signature under the line:
        # - key: BIRTHDAY_FROM
        #   value: 'Your name'
        - key: BIRTHDAY_TIMEZONE
          value: 'Europe/Paris'
        # Days the I.O.U. stays visible after the birthday (hidden before it).
        - key: BIRTHDAY_OPEN_DAYS
          value: '15'
        - key: BIRTHDAY_HALLOWEEN
          value: 'true'
        # The chat friend (off by default): BIRTHDAY_CHAT 'true', with
        # BIRTHDAY_CHAT_NAME / BIRTHDAY_CHAT_PROMPT, CLAUDE_CODE_OAUTH_TOKEN
        # (claude setup-token) from this environment's portal secret so every
        # replica is signed in across restarts (or, with one replica, the
        # claude volume: traitEnvironmentConfigs.claude.enabled), and limits
        # raised to cpu 2 / memory 640Mi (see staging).
        - key: BIRTHDAY_PORT
          value: '8080'
